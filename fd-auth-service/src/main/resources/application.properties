server.port=8081
spring.application.name=service-auth

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/FD_auth_db
spring.datasource.username=postgres
spring.datasource.password=Hongquan@2k5

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Routes file of common-api-flow-lib, a classpath location (default api-routes.xml)
api-flow.routes-location=api-routes.xml

api-flow.max-body-size=2MB

# Paths that skip the API flow (no route, schema or validator check), as Spring path patterns.
# The library already excludes /error, /actuator/**, /v3/api-docs/**, /swagger-ui/**, /swagger-ui.html, /favicon.ico
#   /auth/.well-known/**     : public key (JWKS) other services use to verify JWTs
#   /auth/oauth2/callback/** : Google/Facebook redirect after login; body and params follow the provider's format

api-flow.exclude-paths=/auth/.well-known/**,/auth/oauth2/callback/**
#api-flow.use-default-excludes=false