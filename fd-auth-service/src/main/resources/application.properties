# ID of the key pair above, written as "kid" in the header of every access token and published in the JWKS, so a
# verifier knows which public key to use. Change it whenever the key pair changes
auth.jwt.key-id=fd-auth-dev-1

# Written as "iss" in every access token; verifiers reject a token with any other issuer
auth.jwt.issuer=fd-auth-service

# Lifetime of an access token and of its cookie (default 15m). Lower it (e.g. 10s) to test expiry
auth.jwt.access-ttl=15m

# Lifetime of each refresh token (default 7d). Every refresh issues a new token with a new 7 days, so a session
# unused for this long expires
auth.refresh.idle-ttl=7d

# Maximum lifetime of a session, counted from login and never extended by refresh (default 30d). Must not be
# shorter than idle-ttl
auth.refresh.absolute-ttl=30d

# A refresh token reused within this time after it was replaced is treated as a race between tabs (409
# REFRESH_CONFLICT), after it as a stolen token whose whole session is revoked (default 10s)
auth.refresh.reuse-grace=10s

# Secure attribute of the token cookies (default true): the browser only sends them over HTTPS. Browsers treat
# http://localhost as secure, so it can stay true in dev; set false only for a non-localhost HTTP test server
auth.cookie.secure=true

# Origins (scheme://host[:port], no trailing slash, no *) allowed to send POST/PUT/PATCH/DELETE; another Origin
# gets 403 ORIGIN_NOT_ALLOWED. A request without Origin (Postman, curl) is not checked. Comma-separated, e.g. the
# Vite dev server http://localhost:5173
auth.allowed-origins=http://localhost:5173