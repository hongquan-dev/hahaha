spring.application.name=service-api-gateway
server.port=8080

# Routes are declared below, not discovered from a service registry. Since Spring Cloud 2025 every gateway property
# is under spring.cloud.gateway.server.webflux; the old spring.cloud.gateway.* prefix is ignored
spring.cloud.gateway.server.webflux.discovery.locator.enabled=false

spring.cloud.gateway.server.webflux.routes[0].id=auth-service-route
spring.cloud.gateway.server.webflux.routes[0].uri=http://localhost:8081
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/auth/**
