spring.application.name=service-api-gateway
server.port=8080

# Base URL of each service the gateway forwards to, used by the routes below. Change it per machine or environment
# (e.g. http://fd-auth-service:8081 in Docker) without touching the routes
services.auth.http-url=http://localhost:8081

# Proxies whose X-Forwarded-* / Forwarded headers the gateway trusts, as a regex of their IP. "(?!)" matches nothing:
# headers sent by the client are dropped and the gateway writes its own, with the IP it sees, e.g.
# X-Forwarded-For: 203.0.113.7, which auth-service stores with the session. Unset, the gateway sends no such header
# at all. Behind a load balancer, set its IP here instead
spring.cloud.gateway.server.webflux.trusted-proxies=(?!)

# Routes are declared below, not discovered from a service registry. Since Spring Cloud 2025 every gateway property
# is under spring.cloud.gateway.server.webflux; the old spring.cloud.gateway.* prefix is ignored
spring.cloud.gateway.server.webflux.discovery.locator.enabled=false

# Auth APIs (register, login, me, refresh, logout, JWKS), public: no token check at the gateway, auth-service checks
# the cookies itself. Request and response pass through unchanged, including Origin, Cookie and Set-Cookie.
# Paths outside every route, e.g. /internal/**, get 404 from the gateway
spring.cloud.gateway.server.webflux.routes[0].id=auth-service-route
spring.cloud.gateway.server.webflux.routes[0].uri=${services.auth.http-url}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/auth/**
