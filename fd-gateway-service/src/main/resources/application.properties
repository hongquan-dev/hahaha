spring.application.name=service-api-gateway
server.port=8090

# Base URL of each service behind the gateway, used by the routes; change per environment, e.g. in Docker
services.auth.http-url=http://localhost:8081
services.order.http-url=http://localhost:8083
services.restaurant.http-url=http://localhost:8082

# Regex of proxy IPs whose X-Forwarded-For is trusted; "(?!)" trusts none and writes the IP it sees (unset: no header)
spring.cloud.gateway.server.webflux.trusted-proxies=(?!)

# JWKS of auth-service, fetched at the first request, so the gateway starts even when auth-service is down
gateway.auth.jwks-uri=${services.auth.http-url}/auth/.well-known/jwks.json
# Must equal auth.jwt.issuer of auth-service
gateway.auth.issuer=fd-auth-service
# How long fetched keys are reused (default 5m)
gateway.auth.jwks-cache-ttl=5m
# Earliest early refetch after an unknown kid (default 30s)
gateway.auth.refetch-interval=30s
# Longest wait for auth-service's JWKS; on failure the last keys stay in use (default 2s)
gateway.auth.jwks-timeout=2s
# Paths of JwtAuth routes that need no token, comma-separated Spring path patterns (default none)
gateway.auth.public-paths=/order/health,/restaurant/health

# RateLimit: requests per client IP and path in one window, then 429; counted per gateway instance (default 30)
gateway.rate-limit.limit=30
# Length of a RateLimit window (default 1m)
gateway.rate-limit.window=1m
# Proxies whose X-Forwarded-For gives the client IP; 1 behind nginx, else all clients share its limit (default 0)
gateway.rate-limit.trusted-proxy-hops=0

# Routes are declared below; the old spring.cloud.gateway.* prefix is ignored since Spring Cloud 2025
spring.cloud.gateway.server.webflux.discovery.locator.enabled=false

# Login and registration, limited per client IP by RateLimit; order -1 matches it before the /auth/** route
spring.cloud.gateway.server.webflux.routes[0].id=auth-rate-limited-route
spring.cloud.gateway.server.webflux.routes[0].uri=${services.auth.http-url}
spring.cloud.gateway.server.webflux.routes[0].order=-1
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/auth/login,/auth/register
spring.cloud.gateway.server.webflux.routes[0].predicates[1]=Method=POST
spring.cloud.gateway.server.webflux.routes[0].filters[0]=RateLimit

# Auth APIs, passed through unchanged (cookies, Origin); auth checks tokens itself; /internal/** matches no route: 404
spring.cloud.gateway.server.webflux.routes[1].id=auth-service-route
spring.cloud.gateway.server.webflux.routes[1].uri=${services.auth.http-url}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/auth/**

# Order APIs behind JwtAuth: 401/503 from the gateway, or forwarded with X-User-Id and X-User-Role from the token
spring.cloud.gateway.server.webflux.routes[2].id=order-service-route
spring.cloud.gateway.server.webflux.routes[2].uri=${services.order.http-url}
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/order/**
spring.cloud.gateway.server.webflux.routes[2].filters[0]=JwtAuth

# Restaurant APIs behind JwtAuth like order; the service checks the role of each API from X-User-Role (<roles>)
spring.cloud.gateway.server.webflux.routes[3].id=restaurant-service-route
spring.cloud.gateway.server.webflux.routes[3].uri=${services.restaurant.http-url}
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/restaurant/**
spring.cloud.gateway.server.webflux.routes[3].filters[0]=JwtAuth
