server.port=8083
spring.application.name=service-order

# PostgreSQL; the database is created once by hand (CREATE DATABASE "FD_order_db"), its tables by Flyway
spring.datasource.url=jdbc:postgresql://localhost:5432/FD_order_db
spring.datasource.username=postgres
spring.datasource.password=Hongquan@2k5

# Flyway runs the missing migrations at startup, before Hibernate; none yet, so it only warns
spring.flyway.locations=classpath:db/migration

# Hibernate only checks that tables match the entities and refuses to start otherwise; Flyway owns the schema
spring.jpa.hibernate.ddl-auto=validate
# Off (default true): each transaction returns its database connection when it ends
spring.jpa.open-in-view=false

# Routes file of common-api-flow-lib, a classpath location (default api-routes.xml)
api-flow.routes-location=api-routes.xml

# HTTP base URL of auth-service for AuthHttpClient, reached directly inside the network
services.auth.http-url=http://localhost:8081
# Longest wait for one call to auth-service over HTTP or gRPC, then 503 AUTH_UNAVAILABLE (default 2s)
services.auth.timeout=2s

# gRPC channel "auth" of GrpcClientConfig: fixed host:port, plaintext inside the network
spring.grpc.client.channel.auth.target=static://localhost:9081
