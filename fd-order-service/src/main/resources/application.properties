server.port=8083
spring.application.name=service-order

# PostgreSQL. The database is created by hand once (CREATE DATABASE "FD_order_db"); its tables will come from the
# Flyway migrations in db/migration
spring.datasource.url=jdbc:postgresql://localhost:5432/FD_order_db
spring.datasource.username=postgres
spring.datasource.password=Hongquan@2k5

# Flyway applies the files in classpath:db/migration at startup, before Hibernate. There are none yet: Flyway only
# warns that the folder is missing
spring.flyway.locations=classpath:db/migration

# Hibernate / JPA. The schema belongs to Flyway: validate only checks that tables and columns match the entities and
# stops the application otherwise, it never changes the database
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Routes file of common-api-flow-lib, a classpath location (default api-routes.xml)
api-flow.routes-location=api-routes.xml

# Calls to auth-service, used by AuthHttpClient and AuthGrpcClient. Clients reach order-service through the gateway,
# which sets X-User-Id; auth-service is reached directly, inside the network
services.auth.http-url=http://localhost:8081
# Maximum wait for one call to auth-service, over HTTP (connect and read) and gRPC (deadline); after it the API
# answers 503 AUTH_UNAVAILABLE instead of hanging (default 2s)
services.auth.timeout=2s

# gRPC channel "auth" (stub UserServiceBlockingStub, see GrpcClientConfig). static:// is a fixed host:port; plaintext
# (no TLS) inside the network
spring.grpc.client.channel.auth.target=static://localhost:9081
