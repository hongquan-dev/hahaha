server.port=8081
spring.application.name=service-auth

# Setting PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/FD_auth_db
spring.datasource.username=postgres
spring.datasource.password=Hongquan@2k5

# Setting Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Setting API routes (file trong classpath, dùng bởi common-api-flow-lib; mặc định là api-routes.xml)
api-flow.routes-location=api-routes.xml

api-flow.max-body-size=2MB

# Path bỏ qua luồng xác thực API (không check route/schema/validator), cú pháp pattern của Spring
# Lib đã tự loại trừ sẵn: /error, /actuator/**, /v3/api-docs/**, /swagger-ui/**, /swagger-ui.html, /favicon.ico
#   /auth/.well-known/**     : public key (JWKS) để các service khác verify JWT
#   /auth/oauth2/callback/** : Google/Facebook redirect về sau khi đăng nhập, body/param theo format của bên thứ ba

api-flow.exclude-paths=/auth/.well-known/**,/auth/oauth2/callback/**
#api-flow.use-default-excludes=false